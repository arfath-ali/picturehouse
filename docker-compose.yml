services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '8000:5000'
    volumes:
      - .:/app
      - /app/node_modules/
      - /app/client/node_modules/
      - /app/server/node_modules/
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
    command: sh -c "npm run dev:client & npm run dev:server"
